<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuProfe20 Lab - Ejercicios con Radicales</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- KaTeX para rendering matemático exacto -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
        
        body { margin: 0; padding: 0; overflow: hidden; width: 100vw; height: 100dvh; user-select: none; }
        .font-fun { font-family: 'Nunito', sans-serif; }
        
        @keyframes floatUp { 
            0% { transform: translateY(105vh) rotate(0deg); } 
            100% { transform: translateY(-105vh) rotate(360deg); } 
        }
        @keyframes slideInRight { 
            0% { opacity: 0; transform: translateX(15px); } 
            100% { opacity: 1; transform: translateX(0); } 
        }
        @keyframes confettiExplosion { 
            0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; } 
            80% { opacity: 1; } 
            100% { transform: translate(var(--tx), var(--ty)) scale(0) rotate(var(--rot)); opacity: 0; } 
        }
        @keyframes jellyPop {
            0% { transform: scale3d(.3, .3, .3); opacity: 0; }
            20% { transform: scale3d(1.18, 1.18, 1.18); }
            40% { transform: scale3d(.92, .92, .92); }
            60% { transform: scale3d(1.06, 1.06, 1.06); opacity: 1; }
            80% { transform: scale3d(.97, .97, .97); }
            100% { transform: scale3d(1, 1, 1); opacity: 1; }
        }
        @keyframes robotFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
        @keyframes robotThinkTilt { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(6deg) translateY(-3px); } }
        @keyframes robotJump { 0%, 100% { transform: translateY(0); } 30% { transform: translateY(-15px); } }
        @keyframes robotTalkArmL { 0%, 100% { transform: rotate(45deg); } 50% { transform: rotate(95deg); } }
        @keyframes robotTalkArmR { 0%, 100% { transform: rotate(-45deg); } 50% { transform: rotate(-95deg); } }

        /* Clases para ocultar el scrollbar */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        .animate-floatUp { animation: floatUp linear infinite; }
        .animate-slideInRight { animation: slideInRight 0.3s ease-out forwards; }
        .animate-confettiExplosion { animation: confettiExplosion 1.8s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .animate-jellyPop { animation: jellyPop 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .animate-robotFloat { animation: robotFloat 3s ease-in-out infinite; }
        .animate-robotThinkTilt { animation: robotThinkTilt 2s ease-in-out infinite; }
        .animate-robotJump { animation: robotJump 1s cubic-bezier(0.28, 0.84, 0.42, 1) infinite; }
        .animate-robotTalkArmL { animation: robotTalkArmL 0.6s ease-in-out infinite; }
        .animate-robotTalkArmR { animation: robotTalkArmR 0.6s ease-in-out infinite 0.1s; }

        /* KaTeX Adaptable Styles */
        .katex { font-weight: 900 !important; }
        .katex-display { margin: 0 !important; padding: 0 !important; }
        
        .math-card .katex { font-size: clamp(0.9rem, 1.8vw, 1.25rem) !important; color: #1e293b !important; }
        .math-enunciado .katex { font-size: clamp(1.2rem, 2.5vw, 1.8rem) !important; color: #ffffff !important; }
        .math-current .katex { font-size: clamp(1.6rem, 4vw, 2.8rem) !important; color: #0f172a !important; }
        .math-final .katex { font-size: clamp(1.8rem, 4.5vw, 3.2rem) !important; color: #0f172a !important; }
        .math-robot .katex { font-size: 1.1rem !important; color: inherit !important; }

        /* ESTILOS PARA EL TRUCO DEL SAPITO */
        .sap-node {
            background-color: rgba(251, 191, 36, 0.3); /* Amarillo translúcido */
            border: 2px solid #ef4444; /* Borde rojo */
            border-radius: 50%;
            padding: 1px 3px;
            box-shadow: 0 0 6px rgba(251, 191, 36, 0.8);
            display: inline-block;
            line-height: 1;
            position: relative;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, memo } = React;

        const Icon = ({ paths, className = "", size = 24, fill = "none", strokeWidth = "2.5" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className} dangerouslySetInnerHTML={{__html: paths}} />
        );

        const Zap = (p) => <Icon {...p} paths='<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>' />;
        const VolumeX = (p) => <Icon {...p} paths='<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>' />;
        const Volume2 = (p) => <Icon {...p} paths='<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>' />;
        const Rocket = (p) => <Icon {...p} paths='<path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>' />;
        const Sparkles = (p) => <Icon {...p} paths='<path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M3 5h4"/><path d="M19 3v4"/><path d="M17 5h4"/>' />;
        const Home = (p) => <Icon {...p} paths='<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>' />;
        const ChevronLeft = (p) => <Icon {...p} paths='<polyline points="15 18 9 12 15 6"/>' />;
        const ChevronRight = (p) => <Icon {...p} paths='<polyline points="9 18 15 12 9 6"/>' />;

        const AudioController = {
            ctx: null, muted: false,
            init: function() {
                if (this.ctx) return;
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) this.ctx = new AudioContext();
            },
            play: function(type) {
                if (this.muted || !this.ctx) return;
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain); gain.connect(this.ctx.destination);
                const now = this.ctx.currentTime;
                
                if (type === 'pop') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(500, now); osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                    gain.gain.setValueAtTime(0.25, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now); osc.stop(now + 0.1);
                } else if (type === 'pop-reverse') {
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(650, now); osc.frequency.exponentialRampToValueAtTime(280, now + 0.12);
                    gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                    osc.start(now); osc.stop(now + 0.12);
                } else if (type === 'success') {
                    osc.disconnect();
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, i) => {
                        const o = this.ctx.createOscillator(); const g = this.ctx.createGain();
                        o.type = 'triangle'; o.frequency.value = freq;
                        o.connect(g); g.connect(this.ctx.destination);
                        const startTime = now + (i * 0.07);
                        g.gain.setValueAtTime(0, startTime); g.gain.linearRampToValueAtTime(0.2, startTime + 0.04); g.gain.linearRampToValueAtTime(0, startTime + 0.35);
                        o.start(startTime); o.stop(startTime + 0.35);
                    });
                } else if (type === 'swoosh') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(280, now); osc.frequency.exponentialRampToValueAtTime(70, now + 0.18);
                    gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.18);
                    osc.start(now); osc.stop(now + 0.18);
                }
            },
            toggleMute: function() { this.muted = !this.muted; return this.muted; }
        };

        const RADICAL_EXERCISES = [
            {
                id: 1,
                title: "Ejercicio 1",
                subtitle: "Índices 3, 6 y 12",
                cardGradient: "from-amber-500/30 to-orange-600/30 border-amber-400",
                badgeColor: "bg-amber-500",
                enunciadoText: "Simplifique la expresión:",
                enunciadoLatex: String.raw`\frac{\sqrt[3]{a^2 b} \cdot \sqrt[6]{ab^2}}{\sqrt[12]{a^{-2} b^{-4}}}`,
                steps: [
                    {
                        latex: String.raw`\frac{\sqrt[3]{a^2 b} \cdot \sqrt[6]{ab^2}}{\sqrt[12]{a^{-2} b^{-4}}}`,
                        propertyText: "Expresión Inicial",
                        robotSpeech: "Tenemos radicales con diferentes índices. ¡Vamos a transformar todo a exponentes fraccionarios!"
                    },
                    {
                        latex: String.raw`\frac{a^{\frac{2}{3}}b^{\frac{1}{3}} \cdot a^{\frac{1}{6}}b^{\frac{2}{6}}}{a^{-\frac{2}{12}}b^{-\frac{4}{12}}}`,
                        propertyText: "Raíz a exponente fraccionario",
                        robotSpeech: "Recuerda: el exponente va arriba y el índice de la raíz va abajo en la fracción."
                    },
                    {
                        latex: String.raw`\frac{a^{\frac{4}{6}}b^{\frac{2}{6}} \cdot a^{\frac{1}{6}}b^{\frac{2}{6}}}{a^{-\frac{1}{6}}b^{-\frac{1}{3}}}`,
                        propertyText: "Homogeneizar fracciones",
                        robotSpeech: "Simplificamos y buscamos denominadores iguales para facilitar las sumas."
                    },
                    {
                        latex: String.raw`\frac{a^{\frac{4}{6} + \frac{1}{6}} \cdot b^{\frac{2}{6} + \frac{2}{6}}}{a^{-\frac{1}{6}}b^{-\frac{1}{3}}}`,
                        propertyText: "Multiplicación de bases iguales",
                        robotSpeech: "¡Atención arriba! Al multiplicar bases iguales, los exponentes se suman."
                    },
                    {
                        latex: String.raw`\frac{a^{\frac{5}{6}} \cdot b^{\frac{4}{6}}}{a^{-\frac{1}{6}}b^{-\frac{2}{6}}}`,
                        propertyText: "Suma de exponentes",
                        robotSpeech: "Resolvemos las sumas de los exponentes en el numerador y simplificamos abajo."
                    },
                    {
                        latex: String.raw`a^{\frac{5}{6} - (-\frac{1}{6})} \cdot b^{\frac{4}{6} - (-\frac{2}{6})}`,
                        propertyText: "División de bases iguales",
                        robotSpeech: "Ahora, en la división, los exponentes de abajo suben restando (cambian de signo)."
                    },
                    {
                        latex: String.raw`a^{\frac{6}{6}} \cdot b^{\frac{6}{6}} = \mathbf{ab}`,
                        propertyText: "Resultado Final",
                        robotSpeech: "Al sumar obtenemos fracciones exactas. ¡Nos queda simplemente a por b! ¡Gran trabajo!"
                    }
                ]
            },
            {
                id: 2,
                title: "Ejercicio 2",
                subtitle: "Índices Literales",
                cardGradient: "from-emerald-500/30 to-teal-600/30 border-emerald-400",
                badgeColor: "bg-emerald-500",
                enunciadoText: "Simplifique M:",
                enunciadoLatex: String.raw`M = \sqrt[ab]{x^{a-b}} \cdot \sqrt[bc]{x^{b-c}} \cdot \sqrt[ac]{x^{c-a}}`,
                steps: [
                    {
                        latex: String.raw`M = \sqrt[ab]{x^{a-b}} \cdot \sqrt[bc]{x^{b-c}} \cdot \sqrt[ac]{x^{c-a}}`,
                        propertyText: "Expresión Inicial",
                        robotSpeech: "¡Reto con letras! No te asustes, seguiremos aplicando las mismas propiedades paso a paso."
                    },
                    {
                        latex: String.raw`M = x^{\frac{a-b}{ab}} \cdot x^{\frac{b-c}{bc}} \cdot x^{\frac{c-a}{ac}}`,
                        propertyText: "Convertir a exponente fraccionario",
                        robotSpeech: "Convertimos cada raíz dividiendo el exponente (binomio) entre el índice."
                    },
                    {
                        latex: String.raw`M = x^{\frac{a}{ab} - \frac{b}{ab}} \cdot x^{\frac{b}{bc} - \frac{c}{bc}} \cdot x^{\frac{c}{ac} - \frac{a}{ac}}`,
                        propertyText: "Distributiva en la división",
                        robotSpeech: "Separamos cada fracción en dos partes para poder simplificar las letras."
                    },
                    {
                        latex: String.raw`M = x^{\frac{1}{b}-\frac{1}{a}} \cdot x^{\frac{1}{c}-\frac{1}{b}} \cdot x^{\frac{1}{a}-\frac{1}{c}}`,
                        propertyText: "Simplificación de letras",
                        robotSpeech: "Cancelamos letras repetidas arriba y abajo en cada fracción."
                    },
                    {
                        latex: String.raw`M = x^{\left(\frac{1}{b}-\frac{1}{a}\right) + \left(\frac{1}{c}-\frac{1}{b}\right) + \left(\frac{1}{a}-\frac{1}{c}\right)}`,
                        propertyText: "Multiplicación de bases iguales",
                        robotSpeech: "Como la base siempre es x, unimos todos los exponentes en una gran suma."
                    },
                    {
                        latex: String.raw`M = x^{0} = \mathbf{1}`,
                        propertyText: "Propiedad del exponente cero",
                        robotSpeech: "¡Sorpresa! Todas las fracciones positivas y negativas se cancelan dando 0. ¡Y todo número a la cero es 1!"
                    }
                ]
            },
            {
                id: 3,
                title: "Ejercicio 3",
                subtitle: "Anidados Simples",
                cardGradient: "from-pink-500/30 to-rose-600/30 border-pink-400",
                badgeColor: "bg-pink-500",
                enunciadoText: "Halle el exponente de x en:",
                enunciadoLatex: String.raw`E = \frac{\sqrt[3]{x^2\sqrt{x^3}}}{\sqrt{x^3\sqrt[3]{x^2}}}`,
                steps: [
                    {
                        latex: String.raw`E = \frac{\sqrt[3]{x^2\sqrt{x^3}}}{\sqrt{x^3\sqrt[3]{x^2}}}`,
                        propertyText: "Expresión Inicial",
                        robotSpeech: "Vamos a desarmar estas raíces anidadas resolviendo desde adentro hacia afuera."
                    },
                    {
                        latex: String.raw`E = \frac{\sqrt[3]{x^2 \cdot x^{\frac{3}{2}}}}{\sqrt{x^3 \cdot x^{\frac{2}{3}}}}`,
                        propertyText: "Raíces internas a fracción",
                        robotSpeech: "Primero, las raíces más profundas se convierten en exponentes fraccionarios."
                    },
                    {
                        latex: String.raw`E = \frac{\sqrt[3]{x^{2 + \frac{3}{2}}}}{\sqrt{x^{3 + \frac{2}{3}}}} = \frac{\sqrt[3]{x^{\frac{7}{2}}}}{\sqrt{x^{\frac{11}{3}}}}`,
                        propertyText: "Suma de exponentes",
                        robotSpeech: "Sumamos los exponentes enteros con las fracciones dentro de cada raíz."
                    },
                    {
                        latex: String.raw`E = \frac{x^{\frac{7}{2 \cdot 3}}}{x^{\frac{11}{3 \cdot 2}}} = \frac{x^{\frac{7}{6}}}{x^{\frac{11}{6}}}`,
                        propertyText: "Índice multiplicador",
                        robotSpeech: "El índice de la raíz exterior pasa a multiplicar al denominador del exponente."
                    },
                    {
                        latex: String.raw`E = x^{\frac{7}{6} - \frac{11}{6}} = x^{-\frac{4}{6}}`,
                        propertyText: "División de bases",
                        robotSpeech: "Restamos los exponentes. Siete sextos menos once sextos es menos cuatro sextos."
                    },
                    {
                        latex: String.raw`\mathbf{-\frac{2}{3}}`,
                        propertyText: "Exponente Final",
                        robotSpeech: "Simplificando la fracción nos queda menos dos tercios. ¡Ese es el exponente final!"
                    }
                ]
            },
            {
                id: 4,
                title: "Ejercicio 4",
                subtitle: "Potencias Base 4",
                cardGradient: "from-purple-500/30 to-violet-600/30 border-purple-400",
                badgeColor: "bg-purple-500",
                enunciadoText: "Reduzca:",
                enunciadoLatex: String.raw`R = \frac{\sqrt[6]{4}\sqrt[4]{4}\sqrt[3]{4}}{4\sqrt[5]{4}\sqrt[20]{4}}`,
                steps: [
                    {
                        latex: String.raw`R = \frac{\sqrt[6]{4}\sqrt[4]{4}\sqrt[3]{4}}{4\sqrt[5]{4}\sqrt[20]{4}}`,
                        propertyText: "Expresión Inicial",
                        robotSpeech: "¡Todos tienen base 4! Solo tenemos que sumar y restar exponentes."
                    },
                    {
                        latex: String.raw`R = \frac{4^{\frac{1}{6}} \cdot 4^{\frac{1}{4}} \cdot 4^{\frac{1}{3}}}{4^{1} \cdot 4^{\frac{1}{5}} \cdot 4^{\frac{1}{20}}}`,
                        propertyText: "Exponente fraccionario",
                        robotSpeech: "Transformamos todo. Ojo con el 4 solitario de abajo, su exponente invisible es 1."
                    },
                    {
                        latex: String.raw`R = \frac{4^{\frac{2+3+4}{12}}}{4^{\frac{20+4+1}{20}}}`,
                        propertyText: "Suma con MCM",
                        robotSpeech: "Sumamos usando Mínimo Común Múltiplo para numeradores y denominadores."
                    },
                    {
                        latex: String.raw`R = \frac{4^{\frac{9}{12}}}{4^{\frac{25}{20}}} = \frac{4^{\frac{3}{4}}}{4^{\frac{5}{4}}}`,
                        propertyText: "Simplificación",
                        robotSpeech: "Simplificamos ambas fracciones y resulta que tienen el mismo denominador 4."
                    },
                    {
                        latex: String.raw`R = 4^{\frac{3}{4} - \frac{5}{4}} = 4^{-\frac{2}{4}} = 4^{-\frac{1}{2}}`,
                        propertyText: "División y resta",
                        robotSpeech: "Restamos exponentes. Tres cuartos menos cinco cuartos nos da menos un medio."
                    },
                    {
                        latex: String.raw`R = \mathbf{\frac{1}{2}}`,
                        propertyText: "Resultado Final",
                        robotSpeech: "Un exponente negativo invierte la base, y el exponente 1/2 es raíz cuadrada. Raíz de un cuarto es un medio."
                    }
                ]
            },
            {
                id: 5,
                title: "Ejercicio 5",
                subtitle: "Términos Semejantes",
                cardGradient: "from-cyan-500/30 to-blue-600/30 border-cyan-400",
                badgeColor: "bg-cyan-500",
                enunciadoText: "Reduzca la expresión:",
                enunciadoLatex: String.raw`M = \sqrt[5]{\sqrt[3]{\sqrt{5}}} + 5\frac{\sqrt[15]{5^2}}{\sqrt[10]{5}} - 6\sqrt[60]{5}\sqrt[60]{5}`,
                steps: [
                    {
                        latex: String.raw`M = \sqrt[5]{\sqrt[3]{\sqrt{5}}} + 5\frac{\sqrt[15]{5^2}}{\sqrt[10]{5}} - 6\sqrt[60]{5}\sqrt[60]{5}`,
                        propertyText: "Expresión Inicial",
                        robotSpeech: "Tenemos tres grandes bloques. Vamos a simplificar cada uno por separado."
                    },
                    {
                        latex: String.raw`M = \sqrt[5 \cdot 3 \cdot 2]{5} + 5 \frac{5^{\frac{2}{15}}}{5^{\frac{1}{10}}} - 6 \cdot 5^{\frac{1}{60}} \cdot 5^{\frac{1}{60}}`,
                        propertyText: "Raíz de raíz",
                        robotSpeech: "En el primer bloque multiplicamos los índices: 5 por 3 por 2."
                    },
                    {
                        latex: String.raw`M = 5^{\frac{1}{30}} + 5 \cdot 5^{\frac{2}{15} - \frac{1}{10}} - 6 \cdot 5^{\frac{1}{60} + \frac{1}{60}}`,
                        propertyText: "Operaciones de exponentes",
                        robotSpeech: "Preparamos las restas y sumas de exponentes en el segundo y tercer bloque."
                    },
                    {
                        latex: String.raw`M = 1 \cdot 5^{\frac{1}{30}} + 5 \cdot 5^{\frac{1}{30}} - 6 \cdot 5^{\frac{2}{60}}`,
                        propertyText: "Cálculo de fracciones",
                        robotSpeech: "¡Mágicamente todas las fracciones se simplifican a un treintavo!"
                    },
                    {
                        latex: String.raw`M = (1 + 5 - 6) \cdot 5^{\frac{1}{30}}`,
                        propertyText: "Términos semejantes",
                        robotSpeech: "Como todos comparten 5 a la un treintavo, solo sumamos y restamos los coeficientes."
                    },
                    {
                        latex: String.raw`M = \mathbf{0}`,
                        propertyText: "Resultado Final",
                        robotSpeech: "Uno más cinco menos seis es cero. Cero por cualquier cosa es cero. ¡Perfecto!"
                    }
                ]
            },
            {
                id: 6,
                title: "Ejercicio 6",
                subtitle: "Potencias y Sapito",
                cardGradient: "from-blue-500/30 to-indigo-600/30 border-blue-400",
                badgeColor: "bg-blue-500",
                enunciadoText: "Resuelva usando la regla del Sapito:",
                enunciadoLatex: String.raw`M = \frac{\sqrt{2\sqrt{4\sqrt{8\sqrt{16}}}}}{(\sqrt[4]{\sqrt{2^2\sqrt{2}}})^2}`,
                steps: [
                    {
                        latex: String.raw`M = \frac{\sqrt{2\sqrt{4\sqrt{8\sqrt{16}}}}}{(\sqrt[4]{\sqrt{2^2\sqrt{2}}})^2}`,
                        propertyText: "Expresión Inicial",
                        robotSpeech: "Para aplicar el Sapito, necesitamos bases iguales. Pasaremos 4, 8 y 16 a base 2."
                    },
                    {
                        latex: String.raw`M = \frac{\sqrt[\mathbf{2}]{2^\mathbf{1}\sqrt[\mathbf{2}]{2^\mathbf{2}\sqrt[\mathbf{2}]{2^\mathbf{3}\sqrt[\mathbf{2}]{2^\mathbf{4}}}}}}{(\sqrt[4]{\sqrt[2]{2^2\sqrt[2]{2^1}}})^2}`,
                        propertyText: "Bases 2 e índices visibles",
                        robotSpeech: "Hacemos visibles los índices 2 y exponentes ocultos para prepararnos."
                    },
                    {
                        // Sapito visual (7 Nodos: exp, idx, exp, idx, exp, idx, exp)
                        latex: String.raw`M = \frac{\sqrt[\mathbf{2}]{2^{\htmlId{n6-0}{\htmlClass{sap-node}{1}}}\sqrt[\htmlId{n6-1}{\htmlClass{sap-node}{2}}]{2^{\htmlId{n6-2}{\htmlClass{sap-node}{2}}}\sqrt[\htmlId{n6-3}{\htmlClass{sap-node}{2}}]{2^{\htmlId{n6-4}{\htmlClass{sap-node}{3}}}\sqrt[\htmlId{n6-5}{\htmlClass{sap-node}{2}}]{2^{\htmlId{n6-6}{\htmlClass{sap-node}{4}}}}}}}}{\dots}`,
                        activeSapito: { idPrefix: 'n6-', count: 7, ops: ['\\times', '+', '\\times', '+', '\\times', '+'] },
                        propertyText: "Regla del Sapito (Numerador)",

            {
                id: 7,

                subtitle: "Regla del Sapito",

                badgeColor: "bg-yellow-500",
                enunciadoText: "Resuelva, para x > 0:",
                enunciadoLatex: String.raw`L = \sqrt[9]{x^8\sqrt[7]{x^6\sqrt[5]{x^4\sqrt[3]{x^3}}}}`,
                steps: [
                    {
                        latex: String.raw`L = \sqrt[9]{x^8\sqrt[7]{x^6\sqrt[5]{x^4\sqrt[3]{x^3}}}}`,
                        propertyText: "Expresión Inicial",
                        robotSpeech: "Este es el escenario perfecto para invocar la famosa Regla del Sapito."
                    },
                    {
                        // Sapito visual: Inner nodes only. Outer index 9 is separate.
                        latex: String.raw`L = \sqrt[\mathbf{9}]{x^{\htmlId{n7-0}{\htmlClass{sap-node}{8}}}\sqrt[\htmlId{n7-1}{\htmlClass{sap-node}{7}}]{x^{\htmlId{n7-2}{\htmlClass{sap-node}{6}}}\sqrt[\htmlId{n7-3}{\htmlClass{sap-node}{5}}]{x^{\htmlId{n7-4}{\htmlClass{sap-node}{4}}}\sqrt[\htmlId{n7-5}{\htmlClass{sap-node}{3}}]{x^{\htmlId{n7-6}{\htmlClass{sap-node}{3}}}}}}}`,
                        activeSapito: { idPrefix: 'n7-', count: 7, ops: ['\\times', '+', '\\times', '+', '\\times', '+'] },

                        propertyText: "Formando la raíz única",
                        robotSpeech: "El índice exterior 9 multiplica a todos los demás índices. Y el exponente sigue el camino violeta."
                    },
                    {
                        latex: String.raw`L = \sqrt[945]{x^{((56 + 6) \cdot 5 + 4) \cdot 3 + 3}}`,

                    {

                enunciadoLatex: String.raw`E = \frac{\sqrt[3]{x^2\sqrt[3]{x^2\sqrt[3]{x}}}}{\sqrt[3]{x^2\sqrt[3]{x^2}}}`,
                steps: [
                    {
                        latex: String.raw`E = \frac{\sqrt[3]{x^2\sqrt[3]{x^2\sqrt[3]{x}}}}{\sqrt[3]{x^2\sqrt[3]{x^2}}}`,
                        propertyText: "Expresión Inicial",
                        robotSpeech: "Tenemos dos cadenas de raíces anidadas. Necesitaremos usar la regla del sapito arriba y abajo."

                        robotSpeech: "Calculamos: Arriba 8 por 3 más 1 es 25. Abajo 2 por 3 más 2 es 8."

                    }
                ]
            }
        ];

        const MathDisplay = memo(({ latex, className = "", activeSapito }) => {
            const containerRef = useRef(null);
            const [sapitoPaths, setSapitoPaths] = useState([]);

            // Renderizar KaTeX
            useEffect(() => {
                if (containerRef.current && window.katex) {
                    try {
                        window.katex.render(latex, containerRef.current, {
                            displayMode: true, throwOnError: false, strict: false, trust: true
                        });
                    } catch (e) {
                        containerRef.current.innerText = latex;
                    }
                }
            }, [latex]);

            // Dibujar SVG Overlay encima después del render de KaTeX
            useEffect(() => {
                if (!activeSapito) {
                    setSapitoPaths([]);
                    return;
                }
                const timer = setTimeout(() => {
                    const container = containerRef.current;
                    if (!container) return;
                    const svgRect = container.getBoundingClientRect();
                    const paths = [];
                    for (let i = 0; i < activeSapito.count - 1; i++) {
                        const el1 = document.getElementById(`${activeSapito.idPrefix}${i}`);
                        const el2 = document.getElementById(`${activeSapito.idPrefix}${i+1}`);
                        if (el1 && el2) {
                            const r1 = el1.getBoundingClientRect();
                            const r2 = el2.getBoundingClientRect();
                            
                            // Ajustes para que la curva salga por encima de los círculos
                            const x1 = r1.left + r1.width / 2 - svgRect.left;
                            const y1 = r1.top - svgRect.top;
                            const x2 = r2.left + r2.width / 2 - svgRect.left;
                            const y2 = r2.top - svgRect.top;
                            
                            const cx = (x1 + x2) / 2;
                            const cy = Math.min(y1, y2) - 35; // Altura del arco
                            
                            paths.push({ x1, y1, x2, y2, cx, cy, op: activeSapito.ops[i] });
                        }
                    }
                    setSapitoPaths(paths);
                }, 150); // Ligero retraso para asegurar que DOM esté medible
                
                return () => clearTimeout(timer);
            }, [latex, activeSapito]);

            return (
                <div className={`relative w-full flex justify-center ${className}`}>
                    <div ref={containerRef} className="w-full text-center" />
                    {sapitoPaths.length > 0 && (
                        <svg style={{ position: 'absolute', top: 0, left: 0, width: '100%', height: '100%', pointerEvents: 'none', zIndex: 50, overflow: 'visible' }}>
                            <defs>
                                <marker id="arrowhead" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto">
                                    <polygon points="0 0, 6 3, 0 6" fill="#a855f7" />
                                </marker>
                            </defs>
                            {sapitoPaths.map((p, i) => (
                                <g key={i}>
                                    <path d={`M ${p.x1} ${p.y1} Q ${p.cx} ${p.cy} ${p.x2} ${p.y2}`} fill="none" stroke="#a855f7" strokeWidth="2.5" markerEnd="url(#arrowhead)" strokeLinecap="round" />
                                    <text x={p.cx} y={p.cy - 5} fill="#ef4444" fontSize="18" fontWeight="bold" textAnchor="middle" fontFamily="sans-serif">
                                        {p.op === '\\times' ? '×' : '+'}
                                    </text>
                                </g>
                            ))}
                        </svg>
                    )}
                </div>
            );
        });

        const FloatingBackground = memo(() => {
            const symbols = ['+', '-', '×', '÷', '=', '✨', '√', 'x²', '🚀', '🧠', '%'];
            const elements = Array.from({ length: 30 }).map((_, i) => ({
                id: i, symbol: symbols[Math.floor(Math.random() * symbols.length)], left: `${Math.random() * 100}%`,
                animationDuration: `${10 + Math.random() * 15}s`, animationDelay: `-${Math.random() * 20}s`,
                fontSize: `${1 + Math.random() * 3}rem`, opacity: 0.1 + Math.random() * 0.15
            }));
            return (
                <div className="absolute inset-0 overflow-hidden pointer-events-none z-0">
                    {elements.map((el) => (
                        <div key={el.id} className="absolute text-white font-black animate-floatUp select-none drop-shadow-lg" style={{ left: el.left, bottom: '-15%', fontSize: el.fontSize, opacity: el.opacity, animationDuration: el.animationDuration, animationDelay: el.animationDelay }}>
                            {el.symbol}
                        </div>
                    ))}
                </div>
            );
        });

        const Confetti = memo(() => {
            const colors = ['#fde047', '#60a5fa', '#f472b6', '#34d399', '#a78bfa', '#ff5722'];
            const pieces = Array.from({ length: 120 }).map((_, i) => ({
                id: i, left: `${50 + (Math.random() * 20 - 10)}%`, color: colors[Math.floor(Math.random() * colors.length)],
                tx: `${(Math.random() - 0.5) * 800}px`, ty: `${(Math.random() - 1) * 800}px`, rot: `${Math.random() * 720}deg`, delay: `${Math.random() * 0.2}s`
            }));
            return (
                <div className="absolute inset-0 pointer-events-none z-50 flex items-center justify-center overflow-hidden">
                    {pieces.map((p) => (
                        <div key={p.id} className="absolute w-4 h-4 sm:w-5 sm:h-5 rounded-full animate-confettiExplosion shadow-sm" style={{ backgroundColor: p.color, '--tx': p.tx, '--ty': p.ty, '--rot': p.rot, animationDelay: p.delay, left: p.left, top: '50%' }} />
                    ))}
                </div>
            );
        });

        const RobotAssistant = ({ step, maxSteps }) => {
            const isFinalStep = step >= maxSteps;
            const isThinking = step === maxSteps - 1;

            const getContainerAnim = () => { if (isFinalStep) return 'animate-robotJump'; if (isThinking) return 'animate-robotThinkTilt'; return 'animate-robotFloat'; };
            const getArmLAnim = () => { if (isFinalStep) return 'rotate-[150deg] animate-pulse'; if (step > 0) return 'animate-robotTalkArmL'; return 'rotate-45'; };
            const getArmRAnim = () => { if (isFinalStep) return '-rotate-[150deg] animate-pulse'; if (step > 0) return 'animate-robotTalkArmR'; return '-rotate-45'; };
            
            const getEyes = () => {
                if (isFinalStep) return <div className="w-full flex justify-between px-1.5"><div className="w-3.5 h-2 bg-emerald-400 rounded-t-full mt-1"></div><div className="w-3.5 h-2 bg-emerald-400 rounded-t-full mt-1"></div></div>;
                if (step === 0) return <div className="w-full flex justify-between px-2"><div className="w-2.5 h-2.5 bg-cyan-400 rounded-full animate-pulse"></div><div className="w-2.5 h-2.5 bg-cyan-400 rounded-full animate-pulse"></div></div>;
                return <div className="w-full flex justify-between px-1.5"><div className="w-3 h-3 bg-yellow-400 rounded-full animate-bounce"></div><div className="w-3 h-3 bg-yellow-400 rounded-full animate-bounce"></div></div>;
            };
            const getMouth = () => {
                if (isFinalStep) return <div className="w-6 h-3.5 bg-rose-400 rounded-b-full mt-1.5"></div>;
                if (step === 0) return <div className="w-4 h-1.5 bg-cyan-300 rounded-full mt-2"></div>;
                return <div className="w-3.5 h-3.5 bg-rose-400 rounded-full mt-1 animate-ping"></div>;
            };

            return (
                <div className={`relative flex flex-col items-center drop-shadow-lg select-none ${getContainerAnim()}`}>
                    <div className="relative z-0 flex flex-col items-center translate-y-1">
                        <div className={`w-3.5 h-3.5 rounded-full shadow-[0_0_10px_currentColor] z-10 transition-colors duration-300 ${isFinalStep ? 'text-emerald-400 bg-emerald-400' : 'text-yellow-400 bg-yellow-400 animate-pulse'}`}></div>
                        <div className="w-1.5 h-4 bg-slate-300"></div>
                    </div>
                    <div className="relative z-10 w-16 h-16 sm:w-20 sm:h-20 bg-gradient-to-br from-white to-slate-200 rounded-[1.2rem] border-[3px] border-indigo-400 shadow-xl flex flex-col items-center justify-center p-1.5">
                        <div className="w-full h-full bg-slate-900 rounded-lg flex flex-col items-center justify-center p-1.5 shadow-inner border-2 border-indigo-500">
                            {getEyes()} {getMouth()}
                        </div>
                    </div>
                    <div className={`absolute top-1/2 -left-2 w-3 h-5 bg-slate-200 border-[2.5px] border-indigo-400 rounded-full z-0 origin-top ${getArmLAnim()}`}></div>
                    <div className={`absolute top-1/2 -right-2 w-3 h-5 bg-slate-200 border-[2.5px] border-indigo-400 rounded-full z-0 origin-top ${getArmRAnim()}`}></div>
                </div>
            );
        };

        function App() {
            const [view, setView] = useState('home'); // 'home' | 'lab'
            const [exIdx, setExIdx] = useState(0);
            const [step, setStep] = useState(0);
            const [isMuted, setIsMuted] = useState(false);

            const currentExercise = RADICAL_EXERCISES[exIdx];
            const maxSteps = currentExercise.steps.length - 1;
            const currentStepData = currentExercise.steps[step];

            const handleInteraction = () => AudioController.init();

            const startExercise = (index) => {
                handleInteraction();
                AudioController.play('swoosh');
                setExIdx(index);
                setStep(0);
                setView('lab');
            };

            const nextStep = () => {
                handleInteraction();
                if (step < maxSteps) {
                    const next = step + 1;
                    setStep(next);
                    if (next === maxSteps) AudioController.play('success');
                    else AudioController.play('pop');
                } else {
                    if (exIdx < RADICAL_EXERCISES.length - 1) {
                        AudioController.play('swoosh');
                        setExIdx(exIdx + 1);
                        setStep(0);
                    } else {
                        AudioController.play('swoosh');
                        setView('home');
                    }
                }
            };

            const prevStep = () => {
                handleInteraction();
                if (step > 0) {
                    setStep(step - 1);
                    AudioController.play('pop-reverse');
                }
            };

            const toggleMute = () => { handleInteraction(); setIsMuted(AudioController.toggleMute()); };

            if (view === 'home') {
                return (
                    <div className="w-screen min-h-[100dvh] bg-gradient-to-br from-[#4f46e5] via-[#7c3aed] to-[#db2777] flex flex-col items-center justify-start p-4 sm:p-6 relative font-fun overflow-y-auto overflow-x-hidden scrollbar-hide">
                        <FloatingBackground />
                        
                        <div className="w-full max-w-6xl z-20 flex items-center justify-between mb-8 sm:mb-12 mt-2">
                            <div className="inline-flex items-center gap-2 px-4 py-2 rounded-2xl border-2 border-yellow-300 bg-white/15 backdrop-blur-md text-yellow-300 font-black tracking-wider uppercase shadow-md text-sm sm:text-base">
                                <Rocket className="w-5 h-5 text-yellow-300" /> TuProfe20 Lab
                            </div>
                            <button onClick={toggleMute} className="p-2 sm:p-3 rounded-2xl bg-white/20 border-2 border-white/30 backdrop-blur-md text-white hover:bg-white/30 transition-all active:scale-95">
                                {isMuted ? <VolumeX className="w-5 h-5 sm:w-6 sm:h-6" /> : <Volume2 className="w-5 h-5 sm:w-6 sm:h-6" />}
                            </button>
                        </div>

                        <div className="relative z-10 text-center w-full max-w-6xl flex flex-col items-center">

                                Ejercicios con <span className="text-yellow-300 underline decoration-wavy decoration-pink-400">Radicales</span>
                            </h1>

                                {RADICAL_EXERCISES.map((ex, idx) => (
                                    <button
                                        key={ex.id}
                                        onClick={() => startExercise(idx)}
                                        className="w-[calc(50%-0.5rem)] md:w-[calc(33.333%-1rem)] lg:w-[calc(25%-1.125rem)] group text-left p-3 sm:p-5 rounded-[1.5rem] bg-gradient-to-br bg-opacity-90 backdrop-blur-xl border-[3px] border-white/40 hover:-translate-y-2 hover:shadow-[0_15px_30px_rgba(0,0,0,0.3)] transition-all flex flex-col relative overflow-hidden shadow-lg min-h-[9rem] sm:min-h-[11rem]"
                                        style={{ backgroundImage: `linear-gradient(to bottom right, var(--tw-gradient-stops))` }}
                                    >
                                        <div className={`absolute inset-0 opacity-80 ${ex.cardGradient}`}></div>
                                        <div className="relative z-10 flex-1 flex flex-col">
                                            <div className="flex items-center justify-between mb-2">
                                                <span className={`${ex.badgeColor} text-white text-[10px] sm:text-xs font-black px-2 py-1 rounded-md uppercase tracking-widest shadow-sm`}>
                                                    Reto {ex.id}
                                                </span>
                                                <span className="bg-black/20 text-white text-[10px] sm:text-xs font-bold px-2 py-1 rounded-md">
                                                    {ex.steps.length - 1} pasos
                                                </span>
                                            </div>
                                            <div className="flex-1 my-2 bg-white/95 rounded-xl p-2 sm:p-3 text-slate-900 shadow-inner overflow-hidden flex items-center justify-center border border-white/60 w-full pointer-events-none math-card">
                                                <MathDisplay latex={ex.steps[0].latex} />
                                            </div>
                                            <div className="text-white text-xs sm:text-sm font-black flex items-center justify-between mt-1">
                                                <span className="truncate pr-2 drop-shadow-md">{ex.subtitle}</span>
                                                <span className="bg-yellow-400 text-slate-900 w-6 h-6 rounded-full flex items-center justify-center font-black group-hover:translate-x-1 transition-transform shrink-0 shadow-sm">
                                                    ➔
                                                </span>
                                            </div>
                                        </div>
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="w-screen h-[100dvh] bg-gradient-to-br from-[#1e1b4b] via-[#4c1d95] to-[#db2777] text-slate-800 flex flex-col p-2 sm:p-4 relative font-fun overflow-hidden">
                    <FloatingBackground />
                    {step === maxSteps && <Confetti />}

                    <div className="shrink-0 relative z-10 w-full max-w-6xl mx-auto flex justify-between items-center mb-3 sm:mb-4 px-1">
                        <button onClick={() => { AudioController.play('swoosh'); setView('home'); }} className="flex items-center justify-center px-4 py-2 sm:px-5 sm:py-2.5 rounded-[1rem] sm:rounded-[1.2rem] bg-white/10 border-[3px] border-white/30 backdrop-blur-md text-white font-black hover:bg-white/20 transition-all shadow-lg active:scale-95 text-sm sm:text-base hover:scale-105">
                            <Home className="w-5 h-5 sm:mr-2" />
                            <span className="hidden sm:inline">Portada</span>
                        </button>

                        <div className="flex items-center gap-1.5 sm:gap-2 bg-black/30 p-1.5 sm:p-2 rounded-[1rem] sm:rounded-[1.2rem] border-2 border-white/20 backdrop-blur-md shadow-lg">
                            {RADICAL_EXERCISES.map((ex, i) => (
                                <button
                                    key={ex.id}
                                    onClick={() => startExercise(i)}
                                    className={`w-8 h-8 sm:w-11 sm:h-11 rounded-[0.8rem] sm:rounded-[1rem] font-black text-sm sm:text-base transition-all ${exIdx === i ? 'bg-yellow-400 text-slate-900 scale-110 shadow-[0_0_15px_rgba(250,204,21,0.6)]' : 'text-white hover:bg-white/20'}`}
                                >
                                    {ex.id}
                                </button>
                            ))}
                        </div>

                        <button onClick={toggleMute} className="p-2 sm:p-3 rounded-[1rem] sm:rounded-[1.2rem] bg-white/10 border-[3px] border-white/30 text-white hover:bg-white/20 transition-all shadow-lg active:scale-95 hover:scale-105">
                            {isMuted ? <VolumeX className="w-5 h-5 sm:w-6 sm:h-6" /> : <Volume2 className="w-5 h-5 sm:w-6 sm:h-6" />}
                        </button>
                    </div>

                    <div className="flex-1 min-h-0 relative z-10 w-full max-w-6xl mx-auto bg-white rounded-[2rem] sm:rounded-[2.5rem] border-[6px] sm:border-[8px] border-slate-100 shadow-[0_30px_60px_rgba(0,0,0,0.5)] flex flex-col overflow-hidden">
                        
                        <div className="shrink-0 bg-slate-900 border-b-[6px] border-indigo-500 px-4 py-3 sm:px-8 sm:py-5 flex flex-col items-center justify-center relative shadow-md">
                            <div className="flex items-center gap-3 mb-2 sm:mb-3">
                                <span className="bg-yellow-400 text-slate-900 font-black text-xs sm:text-sm px-3 sm:px-4 py-1 rounded-md uppercase tracking-widest shadow-sm">
                                    {currentExercise.title}
                                </span>
                                <span className="text-purple-200 font-bold text-xs sm:text-base bg-white/10 px-3 py-1 rounded-md">
                                    {currentExercise.subtitle}
                                </span>
                            </div>
                            <div className="flex flex-col sm:flex-row items-center justify-center gap-2 sm:gap-5 text-white font-black text-base sm:text-xl md:text-2xl text-center w-full">
                                <span>{currentExercise.enunciadoText}</span>
                                <div className="math-enunciado inline-block bg-black/40 px-4 py-1.5 rounded-xl border border-white/20">
                                    <MathDisplay latex={currentExercise.enunciadoLatex} />
                                </div>
                            </div>
                        </div>

                        <div className="flex-1 flex flex-col items-center justify-center p-4 sm:p-8 relative bg-slate-50 overflow-hidden w-full">
                            <div className="absolute inset-0 opacity-5 bg-[radial-gradient(#475569_2px,transparent_2px)] [background-size:30px_30px] pointer-events-none"></div>

                            <div key={`badge-${exIdx}-${step}`} className="z-20 mb-4 sm:mb-8 animate-jellyPop text-center">
                                <span className={`inline-flex items-center gap-2 sm:gap-3 px-5 py-2 sm:px-6 sm:py-2.5 rounded-[1rem] font-black text-sm sm:text-lg lg:text-xl shadow-lg border-2 ${step === maxSteps ? 'bg-amber-400 text-slate-900 border-yellow-200' : 'bg-gradient-to-r from-pink-600 to-purple-600 text-white border-pink-400'}`}>
                                    <Sparkles className="w-5 h-5 sm:w-6 sm:h-6" /> 
                                    <span>{currentStepData.propertyText}</span>
                                </span>
                            </div>

                            <div key={`current-${exIdx}-${step}`} className="w-full flex items-center justify-center z-10 animate-jellyPop px-2">
                                <div className={`transition-all px-6 py-4 sm:px-8 sm:py-6 max-w-full text-center ${step === maxSteps ? 'bg-[#fde047] border-[6px] sm:border-[8px] border-[#eab308] rounded-[2rem] sm:rounded-[2.5rem] shadow-[0_15px_40px_rgba(234,179,8,0.5)] math-final' : 'bg-transparent math-current'}`}>
                                    <MathDisplay latex={currentStepData.latex} activeSapito={currentStepData.activeSapito} />
                                </div>
                            </div>
                        </div>

                        <div className="shrink-0 bg-white w-full px-4 py-3 sm:px-8 sm:py-5 flex items-center gap-4 sm:gap-6 border-t-[6px] border-slate-100 z-10 relative">
                            <div className="shrink-0 absolute -top-12 sm:relative sm:-top-0 left-4 sm:left-0 drop-shadow-xl">
                                <RobotAssistant step={step} maxSteps={maxSteps} />
                            </div>
                            <div className="flex-1 text-base sm:text-xl md:text-2xl font-bold text-slate-700 leading-snug sm:leading-relaxed bg-indigo-50/80 p-4 sm:p-5 rounded-[1.2rem] sm:rounded-[1.5rem] border-2 border-indigo-100 min-h-[5rem] flex items-center shadow-sm ml-[4.5rem] sm:ml-0">
                                <div key={`speech-${exIdx}-${step}`} className="animate-slideInRight w-full">
                                    {currentStepData.robotSpeech}
                                </div>
                            </div>
                        </div>

                        <div className="shrink-0 bg-gradient-to-b from-[#eadef7] to-[#d6c1f0] p-3 sm:p-5 w-full flex flex-col items-center border-t-[6px] border-white z-10">
                            <div className="flex justify-center items-stretch w-full max-w-4xl gap-3 sm:gap-4 h-14 sm:h-16">
                                <button
                                    onClick={prevStep}
                                    disabled={step === 0}
                                    className="flex-[0.8] bg-[#d8b4fe] border-b-[6px] border-[#a855f7] text-[#581c87] rounded-l-2xl rounded-r-xl font-black text-base sm:text-xl flex items-center justify-center gap-1 active:border-b-0 active:translate-y-[6px] disabled:opacity-40 transition-all hover:bg-[#e9d5ff]"
                                >
                                    <ChevronLeft className="w-6 h-6 sm:w-8 sm:h-8 stroke-[4px]" />
                                    <span className="hidden sm:inline">Atrás</span>
                                </button>

                                <div className="bg-[#a855f7] text-white font-black px-4 sm:px-6 text-lg sm:text-2xl flex items-center justify-center rounded-2xl border-b-[6px] border-[#7e22ce] shadow-inner whitespace-nowrap min-w-[5rem]">
                                    Paso {step}/{maxSteps}
                                </div>

                                <button
                                    onClick={nextStep}
                                    className={`flex-[2] border-b-[6px] text-white rounded-r-2xl rounded-l-xl font-black text-lg sm:text-2xl md:text-3xl flex items-center justify-center gap-2 active:border-b-0 active:translate-y-[6px] transition-all shadow-sm hover:brightness-110 ${
                                        step === maxSteps
                                            ? 'bg-gradient-to-r from-[#10b981] to-[#047857] border-[#065f46] animate-pulse'
                                            : 'bg-gradient-to-r from-[#f59e0b] to-[#f97316] border-[#c2410c]'
                                    }`}
                                >
                                    <span>
                                        {step < maxSteps
                                            ? '¡Siguiente Paso!'
                                            : exIdx < RADICAL_EXERCISES.length - 1
                                            ? `Ir al Reto ${exIdx + 2}`
                                            : '¡Volver a la Portada!'}
                                    </span>
                                    <ChevronRight className="w-6 h-6 sm:w-8 sm:h-8 stroke-[4px]" />
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
